/* The sticky header and the category rail feed the offsets used by anchor
   jumps and the scroll-spy. These are measured rather than assumed: the
   wordmark is a different height before the webfont arrives, and measuring
   only once left a dead band under the header and made category taps land
   past the section heading. */
function measureSticky(){
  const bar = document.querySelector(".topbar");
  if (!bar) return;
  const rail = document.querySelector(".rail");
  const barH  = Math.round(bar.getBoundingClientRect().height);
  const railH = rail ? Math.round(rail.getBoundingClientRect().height) : 0;
  const css = document.documentElement.style;
  css.setProperty("--railtop", barH + "px");
  css.setProperty("--stickyh", (barH + railH + 10) + "px");
}
let stickyRO;
function watchSticky(){
  if (!window.ResizeObserver) return;
  const targets = [document.querySelector(".topbar"), document.querySelector(".rail")].filter(Boolean);
  if (!targets.length) return;
  if (stickyRO) stickyRO.disconnect();
  stickyRO = new ResizeObserver(measureSticky);
  targets.forEach(t => stickyRO.observe(t));
}
addEventListener("resize", measureSticky);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureSticky);

let spy;
function setupSpy(){
  if (spy) spy.disconnect();
  const pills = [].slice.call(document.querySelectorAll(".cat-pill"));
  if (!pills.length) return;
  pills[0].classList.add("active");
  spy = new IntersectionObserver(es => {
    es.forEach(en => {
      if (!en.isIntersecting) return;
      const id = en.target.id.replace("sec-","");
      pills.forEach(p => p.classList.toggle("active", p.dataset.cat === id));
      const on = document.querySelector(".cat-pill.active");
      if (on) on.scrollIntoView({ inline:"center", block:"nearest", behavior:"smooth" });
    });
  }, { rootMargin:"-" + (parseInt(getComputedStyle(document.documentElement).getPropertyValue("--stickyh"), 10) || 136) + "px 0px -70% 0px" });
  document.querySelectorAll(".sec[id]").forEach(s => spy.observe(s));
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.inc){ state.cart[b.dataset.inc] = (state.cart[b.dataset.inc]||0) + 1; render(); return; }
  if (b.dataset.dec){
    const k = b.dataset.dec; state.cart[k] = Math.max(0,(state.cart[k]||0) - 1);
    if (!state.cart[k]) delete state.cart[k]; render(); return;
  }
  if (b.dataset.clearitem){
    Object.keys(state.cart).forEach(k => { if (k.split(":")[0] === b.dataset.clearitem) delete state.cart[k]; });
    render(); return;
  }
  if (b.hasAttribute("data-opencart")) return openSheet("cart");
  if (b.hasAttribute("data-search")) return openSheet("search");
  if (b.hasAttribute("data-retrypay")) return openCheckout();
  if (b.hasAttribute("data-callserver")) return callServer();
  if (b.dataset.ack) return ackCall(Number(b.dataset.ack));
  if (b.dataset.tab){
    state.adminTab = b.dataset.tab;
    if (state.adminTab === "orders" && !state.history) loadHistory(false); else render();
    return;
  }
  if (b.dataset.range){ state.histRange = b.dataset.range; loadHistory(false); return; }
  if (b.dataset.pay) return setPayment(Number(b.dataset.pay), b.dataset.mode);
  if (b.dataset.split){
    state.splitFor = Number(b.dataset.split); render();
    const f = document.getElementById("splitcash"); if (f){ f.focus(); f.select(); }
    return;
  }
  if (b.dataset.savesplit) return saveSplit(Number(b.dataset.savesplit));
  if (b.hasAttribute("data-cancelsplit")){ state.splitFor = null; render(); return; }
  if (b.hasAttribute("data-more")) return loadHistory(true);
  if (b.hasAttribute("data-changenum")) return changeNumber();
  if (b.hasAttribute("data-picktable")) return openSheet("table");
  if (b.hasAttribute("data-addmore")){ state.myOrder = null; state.myOrderId = null; wire(); render(); return; }
  if (b.hasAttribute("data-sound")) return toggleSound();
  if (b.hasAttribute("data-sound-unlock")){
    /* This click is itself the gesture the browser was waiting for. */
    if (previewSound()) toast("Sound enabled"); else toast("This device is blocking sound.");
    render(); return;
  }
  if (b.hasAttribute("data-clear")) return clearServed();
  if (b.hasAttribute("data-print")) return window.print();
  if (b.hasAttribute("data-savepng")) return saveMasterPng();
  if (b.dataset.avail){
    const id = b.dataset.avail, to = b.dataset.to === "1";
    api.patch("/api/menu/item/" + id, { available: to }).then(() => {
      const it = MENU.flatMap(s => s.items).find(i => i.id === id);
      if (it) it.available = to;
      rebuildCatalogue(); render();
    }).catch(err => toast(err.message || "Could not change that."));
    return;
  }
  if (b.dataset.goto !== undefined) return go(b.dataset.goto || "/");
  if (b.hasAttribute("data-logout")){ api.post("/api/staff/logout").finally(() => { state.staff = false; render(); }); return; }
  if (b.hasAttribute("data-stafflogin")){ const f = document.getElementById("staffpw"); return staffLogin(f ? f.value : ""); }
  if (b.dataset.next) return setStatus(b.dataset.next, b.dataset.status);
  if (b.dataset.cat){ const el = document.getElementById("sec-" + b.dataset.cat); if (el) el.scrollIntoView({ behavior:"smooth", block:"start" }); return; }
});
document.addEventListener("change", async e => {
  const f = e.target.closest(".pxin"); if (!f) return;
  const id = f.dataset.item;
  const item = MENU.flatMap(s => s.items).find(i => i.id === id);

    const v = Math.max(1, Math.min(40, parseInt(e.target.value || "1", 10)));

  { id:"oswald",   name:"Oswald + Karla", note:"condensed menu-board",
    display:'"Oswald",Impact,"Arial Narrow",sans-serif',
    body:'"Karla",system-ui,-apple-system,"Segoe UI",sans-serif',
    url:"Oswald:wght@500;600;700&family=Karla:wght@400;500;600;700" },
  { id:"playfair", name:"Playfair Display + Lato", note:"classic bistro",
    display:'"Playfair Display",Georgia,"Times New Roman",serif',
    body:'"Lato",system-ui,-apple-system,"Segoe UI",sans-serif',
    url:"Playfair+Display:wght@600;700;800&family=Lato:wght@400;700;900" },
  { id:"anton",    name:"Anton + Barlow", note:"bold poster",
    display:'"Anton",Impact,"Arial Narrow",sans-serif',
    body:'"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif',
    url:"Anton&family=Barlow:wght@400;500;600;700" },
  { id:"fraunces", name:"Fraunces + Nunito Sans", note:"warm and characterful",
    display:'"Fraunces",Georgia,"Times New Roman",serif',
    body:'"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif',
    url:"Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700" },
  { id:"archivo",  name:"Archivo Black + Archivo", note:"heavy modern grotesque",
    display:'"Archivo Black",Impact,"Arial Narrow",sans-serif',
    body:'"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif',
    url:"Archivo+Black&family=Archivo:wght@400;500;600;700" },
];
function applyFont(id){
  const f = FONTS.find(x => x.id === id) || FONTS[0];
  if (f.url && !document.getElementById("font-" + f.id)){
    const l = document.createElement("link");
    l.id = "font-" + f.id; l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=" + f.url + "&display=swap";
    document.head.appendChild(l);
  }
  const css = document.documentElement.style;
  css.setProperty("--display", f.display);
  css.setProperty("--body", f.body);
  try { localStorage.setItem("mf_font", f.id); } catch(e){}
  /* the sticky offsets depend on the wordmark's height, which just changed */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureSticky);
  return f.id;
}

/* ============ PALETTES ============
   Swapping a theme is only a change of CSS variables — no markup or logic
   depends on any particular colour. Pick one with ?theme=<id>; the choice
   sticks in localStorage. ?themes=1 shows the picker for comparing them. */
const THEMES = [
  { id:"",       name:"Midnight Gold",  sw:["#1A1918","#E3B24A","#F79F3D"] },
  { id:"ivory",  name:"Ivory & Gold",   sw:["#F7F2E8","#8C6110","#D9822B"] },
  { id:"plum",   name:"Plum & Rose",    sw:["#191022","#E3A695","#E4718D"] },
  { id:"forest", name:"Forest & Brass", sw:["#121A15","#C9A227","#D68B2A"] },
  { id:"ember",  name:"Charcoal Ember", sw:["#131211","#FF9E2C","#FF5F4D"] },
  { id:"indigo", name:"Indigo & Ice",   sw:["#101623","#6CC9E2","#F0A868"] },
];
function applyTheme(id){
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  if (t.id) document.documentElement.setAttribute("data-theme", t.id);
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem("mf_theme", t.id); } catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", t.sw[0]);   /* phone browser chrome follows along */
  return t.id;
}
/* Whatever was chosen last time, applied before anything is drawn. */
(function(){
  const q = new URLSearchParams(location.search).get("font");
  let saved = null; try { saved = localStorage.getItem("mf_font"); } catch(e){}
  const id = q !== null ? q : (saved || "");
  if (id) applyFont(id);
})();

if (new URLSearchParams(location.search).has("themes")){
  const curTheme = document.documentElement.getAttribute("data-theme") || "";
  let curFont = ""; try { curFont = localStorage.getItem("mf_font") || ""; } catch(e){}
  const qf = new URLSearchParams(location.search).get("font");
  if (qf !== null) curFont = qf;

  const bar = document.createElement("div");
  bar.className = "themebar";
  bar.innerHTML =
    '<div class="tbrow"><span class="tblabel">Palette</span>' +
    THEMES.map(t => '<button data-pick="' + t.id + '"' + (t.id === curTheme ? ' class="on"' : '') + '>' +
      '<span class="sw">' + t.sw.map(c => '<i style="background:' + c + '"></i>').join("") + '</span>' +
      t.name + '</button>').join("") + '</div>' +
    '<div class="tbrow"><span class="tblabel">Type</span>' +
    FONTS.map(f => '<button data-font="' + f.id + '"' + (f.id === curFont ? ' class="on"' : '') + '>' +
      f.name + '</button>').join("") + '</div>';
  document.body.appendChild(bar);

  bar.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    e.stopPropagation();
    if (b.dataset.pick !== undefined){
      const now = applyTheme(b.dataset.pick);
      bar.querySelectorAll("[data-pick]").forEach(x => x.classList.toggle("on", x.dataset.pick === now));
    } else if (b.dataset.font !== undefined){
      const now = applyFont(b.dataset.font);
      bar.querySelectorAll("[data-font]").forEach(x => x.classList.toggle("on", x.dataset.font === now));
    }
  });
}

/* ============ THE FALLS ============
   Slow drifting haze behind the page. Canvas rather than images: nothing to
   download, and it costs a few hundred bytes of code. Blurred blobs at a low
   frame rate — this must never compete with scrolling on a cheap phone. */
(function mist(){
  const c = document.getElementById("mist");
  if (!c || !c.getContext) return;
  const ctx = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w = 0, h = 0, blobs = [], raf = 0, last = 0;

  function size(){
    w = c.width  = Math.round(innerWidth  * .5);   /* half res: it is a blur, nobody can tell */
    h = c.height = Math.round(innerHeight * .5);
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
    const n = innerWidth < 600 ? 5 : 8;
    blobs = Array.from({ length: n }, (_, i) => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (70 + Math.random() * 130) * (w / 700 + .5),
      vy: .06 + Math.random() * .16,                /* everything drifts down. it is a falls. */
      vx: (Math.random() - .5) * .07,
      a: .05 + Math.random() * .07,
      warm: i % 3 === 0,
    }));
  }
  /* Painting is separate from animating, so the haze is present even when
     nothing is driving it: reduced-motion, a throttled background tab, or a
     browser that never schedules the frame. Motion is the enhancement. */
  function paint(advance){
    ctx.clearRect(0, 0, w, h);
    for (const b of blobs){
      if (advance){
        b.y += b.vy; b.x += b.vx;
        if (b.y - b.r > h){ b.y = -b.r; b.x = Math.random() * w; }
        if (b.x < -b.r) b.x = w + b.r; else if (b.x > w + b.r) b.x = -b.r;
      }
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      const rgb = b.warm ? "229,190,99" : "143,183,201";
      g.addColorStop(0, `rgba(${rgb},${b.a})`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  function frame(t){
    raf = requestAnimationFrame(frame);
    if (t - last < 55) return;                      /* ~18fps is plenty for fog */
    last = t;
    paint(true);
  }
  function start(){ if (!raf && !still){ last = 0; raf = requestAnimationFrame(frame); } }
  function stop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }

  addEventListener("resize", () => { size(); paint(false); if (!still) { stop(); start(); } },
                   { passive: true });
  document.addEventListener("visibilitychange", () => {   /* no work in a background tab */
    if (document.hidden) stop(); else { paint(false); start(); }
  });
  size();
  paint(false);                                     /* one frame up front, always */
  if (!document.hidden) start();
})();

/* The first touch anywhere is what lets audio play later, so take it: by the
   time the first order lands the chime is already allowed. */
["pointerdown", "keydown"].forEach(ev =>
  document.addEventListener(ev, () => audioReady(), { once: true, capture: true }));

readRoute(); render(); boot();
</script>
